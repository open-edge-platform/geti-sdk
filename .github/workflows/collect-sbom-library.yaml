name: Collect Library Licenses

on:
  schedule:
    - cron: "0 2 * * 1" # Weekly on Monday
  workflow_dispatch:

permissions: {}

jobs:
  collect-licenses:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Collect library licenses
        uses: open-edge-platform/geti-ci/actions/collect-sbom-library@90a5d42c3cab01a95ab8f6bf22fd483bcfc5678b
        with:
          path: .
